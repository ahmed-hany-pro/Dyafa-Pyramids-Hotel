<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dyafa Hotel Pyramids &amp; Spa — Reception</title>
  <link rel="icon" href="../img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ════════════════════ STAFF LOGIN (Supabase Auth) ════════════════════ -->
<div id="staffLogin" class="login-overlay">
  <form class="login-card" id="staffLoginForm" autocomplete="on">
    <a class="brand-logo brand-logo--lg" href="../index.html" title="Back to the Dyafa website"><img src="../assets/logo-dark-sm.png" alt="Dyafa Hotel Pyramids &amp; Spa"></a>
    <div class="login-title">Dyafa Hotel</div>
    <div class="login-sub">Pyramids &amp; Spa · Reception sign in</div>
    <label for="staffEmail">Email</label>
    <input id="staffEmail" type="email" autocomplete="username" required />
    <label for="staffPass">Password</label>
    <input id="staffPass" type="password" autocomplete="current-password" required />
    <div class="login-err" id="staffErr" hidden></div>
    <button class="btn primary" id="staffBtn" type="submit" style="width:100%;margin-top:16px;justify-content:center">Sign in</button>
  </form>
</div>

<!-- ════════════════════ HEADER ════════════════════ -->
<div class="app-header">
  <a class="logo-wrap" href="../index.html" title="Open the Dyafa Hotel website">
    <span class="brand-logo"><img src="../assets/logo-dark-sm.png" alt="Dyafa Hotel Pyramids &amp; Spa"></span>
    <span class="brand-text">
      <span class="logo-name">Dyafa Hotel <em>Pyramids &amp; Spa</em></span>
      <span class="logo-sub">Reception Dashboard</span>
    </span>
  </a>
  <div class="hdr-divider"></div>
  <div class="stat-chips">
    <div class="stat-chip"><div class="stat-dot" style="background:var(--success)"></div><span id="statIn">0 In-House</span></div>
    <div class="stat-chip"><div class="stat-dot" style="background:var(--warning)"></div><span id="statRes">0 Reserved</span></div>
    <div class="stat-chip"><div class="stat-dot" style="background:var(--danger)"></div><span id="statUnpaid">0 Unpaid</span></div>
  </div>
  <div class="header-controls">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme"><span id="themeIcon">☀</span></button>
    <button class="btn req-btn" id="reqBtn" onclick="openRequestsModal()" title="Guest Services access requests">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Guest Requests</span> <span class="req-badge" id="reqBadge" style="display:none">0</span>
    </button>
    <button class="btn req-btn" id="tourBtn" onclick="openToursModal()" title="Tour bookings from Guest Services">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>Tour Bookings</span> <span class="req-badge" id="tourBadge" style="display:none">0</span>
    </button>
    <button class="btn req-btn" id="foodBtn" onclick="openSvcModal('food')" title="Food orders from Guest Services">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6"/><path d="M17 21V3c-2.5 1.5-4 4.5-4 8h4"/></svg><span>Food</span> <span class="req-badge" id="foodBadge" style="display:none">0</span>
    </button>
    <button class="btn req-btn" id="laundryBtn" onclick="openSvcModal('laundry')" title="Laundry requests from Guest Services">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16l-1.5 13a1 1 0 0 1-1 .9h-11a1 1 0 0 1-1-.9z"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="14" r="3"/></svg><span>Laundry</span> <span class="req-badge" id="laundryBadge" style="display:none">0</span>
    </button>
    <button class="btn req-btn" id="housekeepingBtn" onclick="openSvcModal('housekeeping')" title="Housekeeping requests from Guest Services">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 3.5l6 6-4.5 4.5-6-6z"/><path d="M9.5 8L3 20.5 15.5 14"/><path d="M7 14l3 3"/></svg><span>Housekeeping</span> <span class="req-badge" id="housekeepingBadge" style="display:none">0</span>
    </button>
    <button class="btn req-btn" id="listBtn" onclick="openBookingListModal()" title="All bookings">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Booking List</span> <span class="req-badge list-count" id="listBadge">0</span>
    </button>
    <button class="btn primary new-btn" onclick="openNewBookingModal()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New Booking</span></button>
    <button class="btn signout-btn" onclick="DyafaStore.staffSignOut()" title="Sign out" aria-label="Sign out"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</div>

<!-- ════════════════════ NAV ════════════════════ -->
<div class="month-nav">
  <button class="today-btn" onclick="goToToday()"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Today</button>
  <div class="view-toggle">
    <button id="btn-all"    class="view-toggle-btn active" onclick="setViewMode('all')">All Months</button>
    <button id="btn-single" class="view-toggle-btn"        onclick="setViewMode('single')">Single Month</button>
  </div>
  <div id="singleMonthControls" style="display:none;align-items:center;gap:8px">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div id="allMonthsControls" style="display:flex;align-items:center;gap:8px">
    <span style="font-size:11px;color:var(--text-3)">Showing</span>
    <select id="rangeSelect" class="range-select" onchange="renderCalendar();setTimeout(scrollToToday,80)">
      <option value="3">3 months</option>
      <option value="6" selected>6 months</option>
      <option value="12">12 months</option>
    </select>
    <span style="font-size:11px;color:var(--text-3)">ahead</span>
  </div>
  <div class="past-hint" id="pastHint" onclick="document.getElementById('calendarWrapper').scrollLeft=0">← past days</div>
  <div class="grid-menu" id="gridMenu">
    <button class="grid-toggle" id="gridMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false" onclick="toggleGridMenu(event)" title="Choose which gridlines to show">
      <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span id="gridMenuLabel">Grid: All lines</span><svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="grid-pop" id="gridPop" role="menu" hidden>
      <div class="grid-pop-title">Gridlines</div>
      <button type="button" role="menuitemradio" data-mode="all"  onclick="setGridMode('all')"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span>Show all lines</span><i class="tick">✓</i></button>
      <button type="button" role="menuitemradio" data-mode="v"    onclick="setGridMode('v')"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18M12 3v18M17 3v18"/></svg><span>Vertical lines only</span><i class="tick">✓</i></button>
      <button type="button" role="menuitemradio" data-mode="h"    onclick="setGridMode('h')"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span>Horizontal lines only</span><i class="tick">✓</i></button>
      <button type="button" role="menuitemradio" data-mode="none" onclick="setGridMode('none')"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="2 3"/></svg><span>Hide all lines</span><i class="tick">✓</i></button>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--bar-in-border)"></div>Checked In</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--bar-res-border)"></div>Reserved</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--bar-out-border)"></div>Checked Out</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>Unpaid</div>
  </div>
</div>

<!-- ════════════════════ CALENDAR ════════════════════ -->
<div class="calendar-wrapper" id="calendarWrapper">
  <div class="room-labels" id="roomLabels"></div>
  <div class="calendar-grid-area" id="calendarGridArea">
    <div class="days-header" id="daysHeader"></div>
    <div class="grid-body" id="gridBody"></div>
  </div>
</div>

<div class="context-menu" id="contextMenu" style="display:none;"></div>
<div id="modalContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/dyafa-db.js"></script>
<script src="../js/dyafa-store.js"></script>
<!-- boot.js shows the login, then loads the dashboard (javascript.js) once the data is loaded -->
<script src="boot.js"></script>
</body>
</html>
